<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindins Gourmet FX - Cardápio Dois Marcos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --marrom: #5C3317; --laranja: #CC5500; --dourado: #DAA520; --amarelo: #FFD700; --creme: #FFF8DC; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #3E1F0D 0%, #5C3317 50%, #8B4513 100%);
            min-height: 100vh; padding: 15px; font-size: 16px;
        }
        .container { max-width: 800px; margin: 0 auto; background: #FFF8DC; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden; border: 2px solid #DAA520; }
        .header { background: linear-gradient(135deg, #5C3317 0%, #8B4513 100%); color: #FFD700; padding: 20px; text-align: center; }
        .logo { font-size: 1em; font-weight: bold; letter-spacing: 2px; color: #F4A460; }
        .badge-dm { display: inline-block; background: #CC5500; color: #FFD700; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85em; margin: 8px 0; animation: pulse 2s infinite; }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
        .header h1 { font-size: 1.6em; }
        .menu-section { padding: 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .menu-item { background: #FFF8DC; border: 2px solid #DAA520; border-radius: 12px; padding: 15px; text-align: center; transition: all 0.2s; position: relative; }
        .menu-item:active { transform: scale(0.97); border-color: #CC5500; }
        .menu-item.esgotado { opacity: 0.5; pointer-events: none; }
        .menu-item.esgotado::after { content: "ESGOTADO"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-20deg); background: rgba(139,0,0,0.9); color: white; padding: 8px 20px; border-radius: 8px; font-weight: bold; z-index: 5; }
        .sabor-emoji { font-size: 2.5em; margin-bottom: 5px; }
        .menu-item h3 { color: #CC5500; font-size: 1.1em; margin-bottom: 5px; }
        .preco { font-size: 1.3em; color: #CC5500; font-weight: bold; margin: 8px 0; }
        .disponivel { font-size: 0.85em; color: #DAA520; margin-bottom: 8px; }
        .qtd-controle { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-qtd { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #CC5500; background: #FFF8DC; color: #CC5500; font-size: 1.2em; cursor: pointer; font-weight: bold; }
        .btn-qtd:active { background: #CC5500; color: #FFD700; }
        .quantidade { font-size: 1.1em; font-weight: bold; min-width: 25px; text-align: center; color: #8B4513; }
        .carrinho-section { background: #D2691E; padding: 20px; border-top: 3px solid #DAA520; }
        .form-section { background: #FFF8DC; padding: 18px; border-radius: 10px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; color: #8B4513; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #DAA520; border-radius: 10px; font-size: 16px; background: #FFF8DC; }
        .total-section { background: #FFF8DC; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .total-final { font-size: 1.4em; font-weight: bold; color: #CC5500; border-top: 2px solid #DAA520; padding-top: 8px; display: flex; justify-content: space-between; }
        .btn-finalizar { width: 100%; padding: 14px; background: #25D366; color: white; border: none; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-finalizar:disabled { opacity: 0.5; cursor: not-allowed; background: #ccc; }
        .btn-cancelar { width: 100%; padding: 12px; background: #8B0000; color: white; border: none; border-radius: 12px; font-size: 1em; font-weight: bold; cursor: pointer; }
        .pix-info { background: #FFF8DC; padding: 15px; border-radius: 10px; border: 2px solid #DAA520; margin-bottom: 15px; display: none; }
        .pix-chave { background: white; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 1em; text-align: center; word-break: break-all; margin: 8px 0; }
        .btn-copiar-pix { width: 100%; padding: 10px; background: #CC5500; color: #FFD700; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .sucesso-msg { background: #d4edda; color: #155724; padding: 18px; border-radius: 10px; text-align: center; margin-top: 15px; border: 2px solid #28a745; display: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-cancelar { background: #FFF8DC; padding: 25px; border-radius: 16px; max-width: 420px; width: 90%; border: 3px solid #DAA520; text-align: center; }
        .modal-cancelar h2 { color: #CC5500; margin-bottom: 15px; }
        .modal-cancelar input { width: 100%; padding: 14px; border: 2px solid #DAA520; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 15px; }
        .modal-botoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-confirmar-cancel { background: #8B0000; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-fechar-modal { background: #8B4513; color: #FFD700; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; }
        @media (max-width: 480px) { .menu-grid { grid-template-columns: 1fr; } .header h1 { font-size: 1.4em; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DINDINS GOURMET FX</div>
            <span class="badge-dm">🔥 DOIS MARCOS</span>
            <h1>🍫 Cardápio Dois Marcos</h1>
            <p style="color:#F4A460;">Sabores exclusivos - Entrega especial</p>
        </div>
        <div class="menu-section"><div class="menu-grid" id="menu-grid"></div></div>
        <div class="carrinho-section">
            <h3 style="color:#FFD700;text-align:center;margin-bottom:15px;">🛒 Seu Pedido</h3>
            <div id="carrinho-itens"></div>
            <div class="total-section" id="total-section" style="display:none;">
                <div class="total-final"><span>TOTAL:</span><span id="total-geral">R$ 0,00</span></div>
            </div>
            <div class="form-section" id="form-section" style="display:none;">
                <div class="form-group"><label>👤 Nome Completo *</label><input type="text" id="nome-cliente" placeholder="Digite seu nome"></div>
                <div class="form-group"><label>📱 WhatsApp *</label><input type="tel" id="telefone-cliente" placeholder="(00) 00000-0000"></div>
                <div class="form-group"><label>💳 Pagamento *</label><select id="pagamento-select"><option value="">Selecione</option><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div>
                <div class="pix-info" id="pix-info"><h4>📱 Chave PIX</h4><div class="pix-chave" id="pix-chave-display"></div><button class="btn-copiar-pix" onclick="copiarPix()">📋 Copiar PIX</button></div>
            </div>
            <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarPedido()" disabled>📱 Finalizar Pedido</button>
            <button class="btn-cancelar" onclick="abrirModalCancelar()">❌ Cancelar Pedido</button>
            <div class="sucesso-msg" id="sucesso-msg"><h3>✅ Pedido Realizado!</h3><p>📦 Nº <strong id="pedido-id"></strong></p><p style="font-size:1.1em;margin-top:10px;">📱 <strong>ENCAMINHE NO GRUPO DOS DINDINS!</strong></p></div>
        </div>
    </div>

    <!-- MODAL CANCELAR -->
    <div class="modal-overlay" id="modal-cancelar">
        <div class="modal-cancelar">
            <h2>❌ Cancelar Pedido</h2>
            <p style="color:#8B4513;margin-bottom:15px;">Digite o número de telefone usado no pedido:</p>
            <input type="tel" id="cancelar-telefone" placeholder="(00) 00000-0000">
            <div class="modal-botoes">
                <button class="btn-confirmar-cancel" onclick="confirmarCancelamento()">❌ Cancelar</button>
                <button class="btn-fechar-modal" onclick="fecharModalCancelar()">Voltar</button>
            </div>
            <div id="cancelar-resultado" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        // ============ SUPABASE CONFIG ============
        const SUPABASE_URL = 'https://khgkneegpxcgufslupby.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yiQJTpp-mB2sD3QGtSBrOA_euX6346G';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Cardápio conectado ao Supabase!');

        let carrinho = [];
        let cardapioDados = [];

        // ============ CARREGAR CARDÁPIO ============
        async function carregarCardapio() {
            console.log('🔄 Carregando cardápio do Supabase...');
            var result = await supabase.from('cardapio2').select('*');
            cardapioDados = result.data || [];
            console.log('📦 Itens carregados:', cardapioDados.length);
            
            var m = document.getElementById('menu-grid');
            if (cardapioDados.length === 0) {
                m.innerHTML = '<p style="text-align:center;color:#8B4513;padding:40px;">Cardápio indisponível no momento.</p>';
                return;
            }
            
            m.innerHTML = cardapioDados.map(function(i) {
                var qtd = i.quantidade || 0;
                var esgotado = qtd === 0 ? 'esgotado' : '';
                return '<div class="menu-item ' + esgotado + '">' +
                    '<div class="sabor-emoji">' + (i.emoji||'🍫') + '</div>' +
                    '<h3>' + i.nome + '</h3>' +
                    '<p style="color:#8B4513;font-size:0.85em;">' + (i.descricao||'') + '</p>' +
                    '<div class="preco">R$ ' + (i.preco||0).toFixed(2) + '</div>' +
                    '<div class="disponivel">📦 <strong>' + qtd + '</strong> unid. ' + (qtd>0&&qtd<=5?'<span style="color:#CC5500;">⚠️</span>':'') + '</div>' +
                    '<div class="qtd-controle">' +
                        '<button class="btn-qtd" onclick="add(' + i.id + ',-1)">−</button>' +
                        '<span class="quantidade" id="q-' + i.id + '">0</span>' +
                        '<button class="btn-qtd" onclick="add(' + i.id + ',1)">+</button>' +
                    '</div></div>';
            }).join('');
        }

        // ============ CONFIGURAÇÕES ============
        async function getConfig() {
            var result = await supabase.from('config').select('*').eq('chave', 'admin');
            if (result.data && result.data.length > 0) {
                return result.data[0].dados || {};
            }
            return {};
        }

        // ============ CARRINHO ============
        function add(id, q) {
            var i = cardapioDados.find(function(x) { return x.id === id; });
            if (!i) return;
            var mx = i.quantidade || 0;
            var cc = carrinho.find(function(x) { return x.id === id; });
            
            if (cc) {
                var n = cc.quantidade + q;
                if (n <= 0) carrinho = carrinho.filter(function(x) { return x.id !== id; });
                else if (n > mx) { alert('❌ Máximo: ' + mx); return; }
                else cc.quantidade = n;
            } else if (q > 0) {
                if (q > mx) { alert('❌ Máximo: ' + mx); return; }
                carrinho.push({ id: id, nome: i.nome, emoji: i.emoji, preco: i.preco, quantidade: q });
            }
            atualizar();
        }

        function atualizar() {
            // Atualizar quantidades
            cardapioDados.forEach(function(i) {
                var el = document.getElementById('q-' + i.id);
                if (el) {
                    var cc = carrinho.find(function(x) { return x.id === i.id; });
                    el.textContent = cc ? cc.quantidade : 0;
                }
            });
            
            // Carrinho
            var div = document.getElementById('carrinho-itens');
            if (carrinho.length === 0) {
                div.innerHTML = '<p style="text-align:center;color:#FFD700;">🛒 Carrinho vazio</p>';
            } else {
                div.innerHTML = carrinho.map(function(i) {
                    return '<div style="display:flex;justify-content:space-between;padding:8px;background:#FFF8DC;border-radius:6px;margin-bottom:5px;">' +
                        '<span>' + i.emoji + ' ' + i.quantidade + 'x ' + i.nome + '</span>' +
                        '<span style="color:#CC5500;font-weight:bold;">R$ ' + (i.preco*i.quantidade).toFixed(2) + '</span>' +
                        '<span onclick="add(' + i.id + ',-' + i.quantidade + ')" style="cursor:pointer;color:red;">✕</span></div>';
                }).join('');
            }
            
            var fs = document.getElementById('form-section');
            var ts = document.getElementById('total-section');
            if (carrinho.length > 0) { fs.style.display = 'block'; ts.style.display = 'block'; }
            else { fs.style.display = 'none'; ts.style.display = 'none'; }
            
            document.getElementById('total-geral').textContent = 'R$ ' + carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0).toFixed(2);
            validar();
        }

        function validar() {
            document.getElementById('btn-finalizar').disabled = !(carrinho.length > 0 && 
                document.getElementById('nome-cliente').value.trim() && 
                document.getElementById('telefone-cliente').value.trim() && 
                document.getElementById('pagamento-select').value);
        }

        // ============ EVENTOS ============
        document.getElementById('pagamento-select').addEventListener('change', function() {
            document.getElementById('pix-info').style.display = this.value === 'PIX' ? 'block' : 'none';
            validar();
        });
        document.getElementById('nome-cliente').addEventListener('input', validar);
        document.getElementById('telefone-cliente').addEventListener('input', function(e) {
            var v = e.target.value.replace(/\D/g,'').slice(0,11);
            if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
            if (v.length > 10) v = v.slice(0,10) + '-' + v.slice(10);
            e.target.value = v;
            validar();
        });

        async function copiarPix() {
            var config = await getConfig();
            var pix = config.pix || 'pix@dindingourmet.com.br';
            navigator.clipboard.writeText(pix).then(function() {
                alert('✅ Chave PIX copiada!');
            });
        }

        // ============ CANCELAR PEDIDO ============
        function abrirModalCancelar() {
            document.getElementById('modal-cancelar').classList.add('active');
            document.getElementById('cancelar-telefone').value = '';
            document.getElementById('cancelar-resultado').innerHTML = '';
        }
        function fecharModalCancelar() {
            document.getElementById('modal-cancelar').classList.remove('active');
        }
        document.getElementById('cancelar-telefone').addEventListener('input', function(e) {
            var v = e.target.value.replace(/\D/g,'').slice(0,11);
            if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
            if (v.length > 10) v = v.slice(0,10) + '-' + v.slice(10);
            e.target.value = v;
        });

        async function confirmarCancelamento() {
            var tel = document.getElementById('cancelar-telefone').value.replace(/\D/g,'');
            if (!tel) { document.getElementById('cancelar-resultado').innerHTML = '<p style="color:#8B0000;">❌ Digite o telefone!</p>'; return; }

            var result = await supabase.from('todosPedidos').select('*').eq('telefone', tel).eq('status', 'novo');
            var pedido = result.data && result.data.length > 0 ? result.data[0] : null;

            if (!pedido) {
                document.getElementById('cancelar-resultado').innerHTML = '<p style="color:#8B0000;">❌ Nenhum pedido ativo encontrado.</p>';
                return;
            }

            await supabase.from('todosPedidos').update({ status: 'cancelado', pagamentoStatus: 'cancelado' }).eq('pedido_id', pedido.pedido_id);
            
            // Devolver itens ao cardápio
            (pedido.itens || []).forEach(async function(i) {
                var r = await supabase.from('cardapio2').select('*').eq('nome', i.nome);
                var item = r.data && r.data.length > 0 ? r.data[0] : null;
                if (item) {
                    await supabase.from('cardapio2').update({ quantidade: (item.quantidade||0) + i.quantidade }).eq('id', item.id);
                }
            });

            document.getElementById('cancelar-resultado').innerHTML = '<p style="color:#228B22;">✅ Pedido cancelado! Itens devolvidos.</p>';
            carregarCardapio();
            setTimeout(fecharModalCancelar, 2000);
        }

        // ============ FINALIZAR PEDIDO ============
        async function finalizarPedido() {
            var nome = document.getElementById('nome-cliente').value.trim();
            var tel = document.getElementById('telefone-cliente').value.trim().replace(/\D/g,'');
            var pag = document.getElementById('pagamento-select').value;
            var sub = carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0);
            
            if (!nome || !tel || !pag || carrinho.length === 0) { alert('Preencha todos os campos!'); return; }

            var config = await getConfig();
            var pedidoId = Date.now();

            // Salvar no Supabase
            await supabase.from('todosPedidos').insert([{
                pedido_id: pedidoId,
                data: new Date().toISOString(),
                cardapio: 'cardapio2',
                cardapioNome: 'Dindins Gourmet FX Cardápio Dois Marcos',
                cliente: nome,
                telefone: tel,
                pagamento: pag,
                total: sub,
                itens: carrinho.map(function(i) { return { nome: i.nome, emoji: i.emoji, quantidade: i.quantidade, preco: i.preco }; }),
                status: 'novo',
                pagamentoStatus: 'pendente'
            }]);

            // Atualizar estoque
            for (var idx = 0; idx < carrinho.length; idx++) {
                var item = carrinho[idx];
                var r = await supabase.from('cardapio2').select('*').eq('id', item.id);
                var atual = r.data && r.data.length > 0 ? r.data[0] : null;
                if (atual) {
                    await supabase.from('cardapio2').update({ quantidade: Math.max(0, (atual.quantidade||0) - item.quantidade) }).eq('id', item.id);
                }
            }

            // Montar nota WhatsApp
            var nota = '🍫 *NOVO PEDIDO - Dois Marcos* 🍫\n\n';
            nota += '👤 *' + nome + '*\n';
            nota += '📱 *' + tel + '*\n';
            nota += '💳 *' + pag + '*\n\n';
            nota += '📋 *ITENS:*\n';
            carrinho.forEach(function(i) {
                nota += i.emoji + ' ' + i.quantidade + 'x ' + i.nome + ' - R$ ' + (i.preco*i.quantidade).toFixed(2) + '\n';
            });
            nota += '\n💵 *TOTAL: R$ ' + sub.toFixed(2) + '*\n';
            if (pag === 'PIX') nota += '\n📱 *Chave PIX:* `' + (config.pix || 'pix@dindingourmet.com.br') + '`';
            nota += '\n\n📱 *ENCAMINHE NO GRUPO DOS DINDINS!*';

            var whatsapp = config.whatsapp || '5561986471897';
            window.open('https://wa.me/' + whatsapp + '?text=' + encodeURIComponent(nota), '_blank');

            document.getElementById('pedido-id').textContent = '#' + pedidoId;
            document.getElementById('sucesso-msg').style.display = 'block';
            document.getElementById('btn-finalizar').style.display = 'none';
            document.getElementById('form-section').style.display = 'none';
            carrinho = []; atualizar(); carregarCardapio();
        }

        // ============ INICIAR ============
        carregarCardapio();
        atualizar();
        getConfig().then(function(c) {
            document.getElementById('pix-chave-display').textContent = c.pix || 'pix@dindingourmet.com.br';
        });
    </script>
</body>
</html>
