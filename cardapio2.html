<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Dindins Gourmet FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:linear-gradient(135deg,#3E1F0D,#5C3317,#8B4513); min-height:100vh; padding:15px; font-size:18px; }
        .container { max-width:850px; margin:0 auto; background:#FFF8DC; border-radius:20px; overflow:hidden; border:2px solid #DAA520; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .header { background:linear-gradient(135deg,#5C3317,#8B4513); color:#FFD700; padding:25px; text-align:center; }
        .header h1 { font-size:2em; }
        .menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:15px; padding:20px; }
        .menu-item { background:#FFF8DC; border:2px solid #DAA520; border-radius:16px; padding:18px; text-align:center; transition:all 0.3s; }
        .menu-item:hover { transform:translateY(-5px); box-shadow:0 10px 30px rgba(0,0,0,0.2); }
        .menu-item .foto-item { width:100%; height:140px; border-radius:12px; object-fit:cover; margin-bottom:10px; }
        .menu-item .emoji-item { font-size:4.5em; margin-bottom:10px; }
        .menu-item h3 { color:#CC5500; font-size:1.2em; }
        .preco { font-size:1.5em; color:#CC5500; font-weight:800; }
        .disponivel { font-size:0.95em; color:#DAA520; }
        .qtd-controle { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:10px; }
        .btn-qtd { width:44px; height:44px; border-radius:50%; border:2px solid #CC5500; background:#FFF8DC; color:#CC5500; font-size:1.3em; cursor:pointer; font-weight:bold; }
        .btn-qtd:active { background:#CC5500; color:#FFD700; }
        .quantidade { font-size:1.2em; font-weight:bold; color:#8B4513; }
        .carrinho-section { background:#D2691E; padding:25px; border-top:3px solid #DAA520; }
        .carrinho-title { color:#FFD700; text-align:center; font-size:1.5em; margin-bottom:15px; }
        .form-section { background:#FFF8DC; padding:20px; border-radius:14px; margin-bottom:15px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:bold; color:#8B4513; margin-bottom:5px; font-size:1.05em; }
        .form-group input, .form-group select { width:100%; padding:14px; border:2px solid #DAA520; border-radius:12px; font-size:17px; background:#FFFDF5; }
        .total-section { background:#FFF8DC; padding:18px; border-radius:14px; margin-bottom:15px; }
        .total-final { font-size:1.5em; font-weight:800; color:#CC5500; display:flex; justify-content:space-between; }
        .btn-finalizar { width:100%; padding:16px; background:linear-gradient(135deg,#25D366,#16a34a); color:white; border:none; border-radius:14px; font-size:1.2em; font-weight:bold; cursor:pointer; }
        .btn-finalizar:disabled { opacity:0.5; background:#ccc; }
        .pix-info { display:none; background:#FFF8DC; padding:18px; border-radius:14px; border:2px solid #DAA520; margin-bottom:15px; }
        .pix-chave { background:white; padding:14px; border-radius:12px; font-size:1.15em; text-align:center; word-break:break-all; }
        .btn-copiar-pix { width:100%; padding:12px; background:#CC5500; color:#FFD700; border:none; border-radius:12px; font-size:1.05em; cursor:pointer; font-weight:bold; margin-top:8px; }
        .sucesso-msg { display:none; background:#dcfce7; color:#166534; padding:20px; border-radius:14px; text-align:center; margin-top:15px; font-size:1.15em; }
        .item-carrinho { display:flex; justify-content:space-between; align-items:center; padding:12px; background:#FFF8DC; border-radius:10px; margin-bottom:8px; font-size:1.05em; }
        .btn-remover { background:#ef4444; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; }
        @media (max-width:480px) { .menu-grid { grid-template-columns:1fr; } .header h1 { font-size:1.6em; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🍦 Cardápio</h1></div>
        <div class="menu-grid" id="menu-grid"></div>
        <div class="carrinho-section">
            <h3 class="carrinho-title">🛒 Seu Pedido</h3>
            <div id="carrinho-itens"></div>
            <div class="total-section" id="total-section" style="display:none;">
                <div class="total-final"><span>TOTAL:</span><span id="total-geral">R$ 0,00</span></div>
            </div>
            <div class="form-section" id="form-section" style="display:none;">
                <div class="form-group"><label>👤 Nome Completo *</label><input type="text" id="nome-cliente"></div>
                <div class="form-group"><label>📱 WhatsApp *</label><input type="tel" id="telefone-cliente" placeholder="(00) 00000-0000"></div>
                <div class="form-group"><label>💳 Pagamento *</label><select id="pagamento-select"><option value="">Selecione</option><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div>
                <div class="pix-info" id="pix-info"><h4>📱 Chave PIX</h4><div class="pix-chave" id="pix-chave-display"></div><button class="btn-copiar-pix" onclick="copiarPix()">📋 Copiar PIX</button></div>
            </div>
            <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarPedido()" disabled>📱 Finalizar Pedido</button>
            <div class="sucesso-msg" id="sucesso-msg"><h3>✅ Pedido Realizado!</h3><p>📦 Nº <strong id="pedido-id"></strong></p></div>
        </div>
    </div>

    <script>
        var supabase = window.supabase.createClient('https://khgkneegpxcgufslupby.supabase.co', 'sb_publishable_yiQJTpp-mB2sD3QGtSBrOA_euX6346G');
        let carrinho = [], cardapioDados = [], configDados = {};

        async function carregarConfig() {
            var { data } = await supabase.from('config').select('*').eq('chave','admin').maybeSingle();
            configDados = data ? (data.dados || {}) : {};
            document.getElementById('pix-chave-display').textContent = configDados.pix || 'pix@dindingourmet.com.br';
        }

        async function carregarCardapio() {
            var { data } = await supabase.from('cardapio2').select('*');
            cardapioDados = data || [];
            var m = document.getElementById('menu-grid');
            if (cardapioDados.length === 0) { m.innerHTML = '<p style="color:#8B4513;">Indisponível.</p>'; return; }
            m.innerHTML = cardapioDados.map(function(i) {
                var fotoHtml = i.foto ? '<img src="' + i.foto + '" class="foto-item" alt="' + i.nome + '">' : '<span class="emoji-item">' + (i.emoji||'🍦') + '</span>';
                return '<div class="menu-item">' + fotoHtml + '<h3>' + i.nome + '</h3><div class="preco">R$ ' + (i.preco||0).toFixed(2) + '</div><p class="disponivel">📦 <strong>' + (i.quantidade||0) + '</strong> unid.</p><div class="qtd-controle"><button class="btn-qtd" onclick="add(\'' + i.id + '\',-1)">−</button><span class="quantidade" id="q-' + i.id + '">0</span><button class="btn-qtd" onclick="add(\'' + i.id + '\',1)">+</button></div></div>';
            }).join('');
        }

        function add(id, q) {
            var i = cardapioDados.find(function(x) { return x.id == id; }); if (!i) return;
            var mx = i.quantidade||0, cc = carrinho.find(function(x) { return x.id == id; });
            if (cc) { var n = cc.quantidade + q; if (n <= 0) carrinho = carrinho.filter(function(x) { return x.id != id; }); else if (n > mx) { alert('Máx: ' + mx); return; } else cc.quantidade = n; }
            else if (q > 0) { if (q > mx) { alert('Máx: ' + mx); return; } carrinho.push({ id: id, nome: i.nome, emoji: i.emoji, preco: i.preco, quantidade: q }); }
            atualizar();
        }

        function atualizar() {
            cardapioDados.forEach(function(i) { var el = document.getElementById('q-' + i.id); if (el) { var cc = carrinho.find(function(x) { return x.id == i.id; }); el.textContent = cc ? cc.quantidade : 0; } });
            var div = document.getElementById('carrinho-itens');
            if (carrinho.length === 0) div.innerHTML = '<p style="color:#FFD700;">Carrinho vazio</p>';
            else div.innerHTML = carrinho.map(function(i) { return '<div class="item-carrinho"><span>' + (i.emoji||'🍦') + ' ' + i.quantidade + 'x ' + i.nome + '</span><span style="color:#CC5500;font-weight:bold;">R$ ' + (i.preco*i.quantidade).toFixed(2) + '</span><button class="btn-remover" onclick="add(\'' + i.id + '\',-' + i.quantidade + ')">✕</button></div>'; }).join('');
            var fs = document.getElementById('form-section'), ts = document.getElementById('total-section');
            if (carrinho.length > 0) { fs.style.display = 'block'; ts.style.display = 'block'; } else { fs.style.display = 'none'; ts.style.display = 'none'; }
            document.getElementById('total-geral').textContent = 'R$ ' + carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0).toFixed(2);
            validar();
        }

        function validar() {
            document.getElementById('btn-finalizar').disabled = !(carrinho.length > 0 && document.getElementById('nome-cliente').value.trim() && document.getElementById('telefone-cliente').value.trim() && document.getElementById('pagamento-select').value);
        }

        function copiarPix() {
            navigator.clipboard.writeText(configDados.pix || 'pix@dindingourmet.com.br').then(function() { alert('✅ Copiado!'); });
        }

        async function finalizarPedido() {
            var nome = document.getElementById('nome-cliente').value.trim();
            var tel = document.getElementById('telefone-cliente').value.trim().replace(/\D/g,'');
            var pag = document.getElementById('pagamento-select').value;
            var sub = carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0);
            if (!nome || !tel || !pag || carrinho.length === 0) { alert('Preencha!'); return; }
            var pedidoId = Date.now();
            
            // Salvar pedido
            await supabase.from('todospedidos').insert([{ pedido_id: pedidoId, data: new Date().toISOString(), cardapio: 'cardapio2', cliente: nome, telefone: tel, pagamento: pag, total: sub, itens: carrinho.map(function(i) { return { nome: i.nome, emoji: i.emoji, quantidade: i.quantidade, preco: i.preco }; }), status: 'novo', pagamentostatus: 'pendente' }]);

            // ✅ BAIXAR ESTOQUE DO CARDÁPIO 2
            for (var idx = 0; idx < carrinho.length; idx++) {
                var item = carrinho[idx];
                var { data: atual } = await supabase.from('cardapio2').select('*').eq('id', item.id).maybeSingle();
                if (atual) {
                    var novaQtd = Math.max(0, (atual.quantidade||0) - item.quantidade);
                    await supabase.from('cardapio2').update({ quantidade: novaQtd }).eq('id', item.id);
                }
            }

            // Mensagem WhatsApp
            var msg = '🍦 *NOVO PEDIDO* 🍦\n\n👤 *' + nome + '*\n📱 *' + tel + '*\n📦 *Pedido #' + pedidoId + '*\n💳 *' + pag + '*\n\n📋 *ITENS:*\n';
            carrinho.forEach(function(i) { msg += (i.emoji||'🍦') + ' ' + i.quantidade + 'x ' + i.nome + ' - R$ ' + (i.preco*i.quantidade).toFixed(2) + '\n'; });
            msg += '\n💵 *TOTAL: R$ ' + sub.toFixed(2) + '*';
            if (pag === 'PIX') msg += '\n\n📱 *PIX:* `' + (configDados.pix || 'pix@dindingourmet.com.br') + '`';
            window.open('https://wa.me/' + (configDados.whatsapp || '5561986471897') + '?text=' + encodeURIComponent(msg), '_blank');

            document.getElementById('pedido-id').textContent = '#' + pedidoId;
            document.getElementById('sucesso-msg').style.display = 'block';
            document.getElementById('btn-finalizar').style.display = 'none';
            carrinho = []; atualizar(); carregarCardapio();
        }

        document.getElementById('telefone-cliente').addEventListener('input', function(e) {
            var v = e.target.value.replace(/\D/g,'').slice(0,11);
            if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
            if (v.length > 10) v = v.slice(0,10) + '-' + v.slice(10);
            e.target.value = v; validar();
        });
        document.getElementById('nome-cliente').addEventListener('input', validar);
        document.getElementById('pagamento-select').addEventListener('change', function() {
            document.getElementById('pix-info').style.display = this.value === 'PIX' ? 'block' : 'none'; validar();
        });

        carregarConfig();
        carregarCardapio();
        atualizar();
    </script>
</body>
</html>
