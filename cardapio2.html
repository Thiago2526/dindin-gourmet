<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Dindins Gourmet FX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #3E1F0D, #5C3317, #8B4513); min-height: 100vh; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: #FFF8DC; border-radius: 16px; overflow: hidden; border: 2px solid #DAA520; }
        .header { background: linear-gradient(135deg, #5C3317, #8B4513); color: #FFD700; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.5em; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 15px; }
        .menu-item { background: #FFF8DC; border: 2px solid #DAA520; border-radius: 12px; padding: 15px; text-align: center; }
        .menu-item h3 { color: #CC5500; }
        .preco { font-size: 1.3em; color: #CC5500; font-weight: bold; }
        .qtd-controle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
        .btn-qtd { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #CC5500; background: #FFF8DC; color: #CC5500; font-size: 1.2em; cursor: pointer; font-weight: bold; }
        .btn-qtd:active { background: #CC5500; color: #FFD700; }
        .quantidade { font-weight: bold; color: #8B4513; }
        .carrinho-section { background: #D2691E; padding: 20px; border-top: 3px solid #DAA520; }
        .form-section { background: #FFF8DC; padding: 18px; border-radius: 10px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; color: #8B4513; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #DAA520; border-radius: 10px; font-size: 16px; }
        .total-section { background: #FFF8DC; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .total-final { font-size: 1.4em; font-weight: bold; color: #CC5500; display: flex; justify-content: space-between; }
        .btn-finalizar { width: 100%; padding: 14px; background: #25D366; color: white; border: none; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .btn-finalizar:disabled { opacity: 0.5; background: #ccc; }
        .pix-info { display: none; background: #FFF8DC; padding: 15px; border-radius: 10px; border: 2px solid #DAA520; margin-bottom: 15px; }
        .pix-chave { background: white; padding: 10px; border-radius: 8px; text-align: center; word-break: break-all; }
        .btn-copiar-pix { width: 100%; padding: 10px; background: #CC5500; color: #FFD700; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .sucesso-msg { display: none; background: #d4edda; color: #155724; padding: 18px; border-radius: 10px; text-align: center; margin-top: 15px; }
        @media (max-width: 480px) { .menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cardápio</h1>
        </div>
        <div class="menu-grid" id="menu-grid"></div>
        <div class="carrinho-section">
            <h3 style="color:#FFD700;text-align:center;margin-bottom:15px;">🛒 Seu Pedido</h3>
            <div id="carrinho-itens"></div>
            <div class="total-section" id="total-section" style="display:none;">
                <div class="total-final"><span>TOTAL:</span><span id="total-geral">R$ 0,00</span></div>
            </div>
            <div class="form-section" id="form-section" style="display:none;">
                <div class="form-group"><label>👤 Nome Completo *</label><input type="text" id="nome-cliente"></div>
                <div class="form-group"><label>📱 WhatsApp *</label><input type="tel" id="telefone-cliente" placeholder="(00) 00000-0000"></div>
                <div class="form-group"><label>💳 Pagamento *</label><select id="pagamento-select"><option value="">Selecione</option><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div>
                <div class="pix-info" id="pix-info"><h4>📱 Chave PIX</h4><div class="pix-chave" id="pix-chave-display"></div><button class="btn-copiar-pix" onclick="copiarPix()">📋 Copiar PIX</button></div>
            </div>
            <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarPedido()" disabled>📱 Finalizar Pedido</button>
            <div class="sucesso-msg" id="sucesso-msg"><h3>✅ Pedido Realizado!</h3><p>📦 Nº <strong id="pedido-id"></strong></p></div>
        </div>
    </div>

    <script>
        console.log('✅ Cardápio 2 carregado!');
        let carrinho = [], cardapioDados = [];

        function getDados(chave) { return JSON.parse(localStorage.getItem(chave) || '[]'); }
        function setDados(chave, dados) { localStorage.setItem(chave, JSON.stringify(dados)); }

        function carregarCardapio() {
            cardapioDados = getDados('cardapio2');
            console.log('📦 Itens no Cardápio 2:', cardapioDados.length);
            var m = document.getElementById('menu-grid');
            if (cardapioDados.length === 0) { m.innerHTML = '<p style="color:#8B4513;">Cardápio indisponível.</p>'; return; }
            m.innerHTML = cardapioDados.map(function(i) {
                var qtd = i.quantidade || 0;
                return '<div class="menu-item"><div style="font-size:2.5em;">' + (i.emoji||'🍫') + '</div><h3>' + i.nome + '</h3><div class="preco">R$ ' + (i.preco||0).toFixed(2) + '</div><p style="font-size:0.9em;">📦 <strong>' + qtd + '</strong> unid.</p><div class="qtd-controle"><button class="btn-qtd" onclick="add(\'' + i.id + '\',-1)">−</button><span class="quantidade" id="q-' + i.id + '">0</span><button class="btn-qtd" onclick="add(\'' + i.id + '\',1)">+</button></div></div>';
            }).join('');
            var c = JSON.parse(localStorage.getItem('adminConfig') || '{}');
            document.getElementById('pix-chave-display').textContent = c.pix || 'pix@dindingourmet.com.br';
        }

        function add(id, q) {
            var i = cardapioDados.find(function(x) { return x.id === id; });
            if (!i) return;
            var mx = i.quantidade || 0;
            var cc = carrinho.find(function(x) { return x.id === id; });
            if (cc) { var n = cc.quantidade + q; if (n <= 0) carrinho = carrinho.filter(function(x) { return x.id !== id; }); else if (n > mx) { alert('Máx: ' + mx); return; } else cc.quantidade = n; }
            else if (q > 0) { if (q > mx) { alert('Máx: ' + mx); return; } carrinho.push({ id: id, nome: i.nome, emoji: i.emoji, preco: i.preco, quantidade: q }); }
            atualizar();
        }

        function atualizar() {
            cardapioDados.forEach(function(i) { var el = document.getElementById('q-' + i.id); if (el) { var cc = carrinho.find(function(x) { return x.id === i.id; }); el.textContent = cc ? cc.quantidade : 0; } });
            var div = document.getElementById('carrinho-itens');
            div.innerHTML = carrinho.length === 0 ? '<p style="color:#FFD700;">Vazio</p>' : carrinho.map(function(i) { return '<div style="display:flex;justify-content:space-between;padding:8px;background:#FFF8DC;border-radius:6px;margin-bottom:5px;"><span>' + i.emoji + ' ' + i.quantidade + 'x ' + i.nome + '</span><span style="color:#CC5500;">R$ ' + (i.preco*i.quantidade).toFixed(2) + '</span></div>'; }).join('');
            var fs = document.getElementById('form-section'), ts = document.getElementById('total-section');
            if (carrinho.length > 0) { fs.style.display = 'block'; ts.style.display = 'block'; } else { fs.style.display = 'none'; ts.style.display = 'none'; }
            document.getElementById('total-geral').textContent = 'R$ ' + carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0).toFixed(2);
            validar();
        }

        function validar() {
            document.getElementById('btn-finalizar').disabled = !(carrinho.length > 0 && document.getElementById('nome-cliente').value.trim() && document.getElementById('telefone-cliente').value.trim() && document.getElementById('pagamento-select').value);
        }

        function copiarPix() {
            var c = JSON.parse(localStorage.getItem('adminConfig') || '{}');
            navigator.clipboard.writeText(c.pix || 'pix@dindingourmet.com.br').then(function() { alert('✅ Copiado!'); });
        }

        function finalizarPedido() {
            var nome = document.getElementById('nome-cliente').value.trim();
            var tel = document.getElementById('telefone-cliente').value.trim().replace(/\D/g,'');
            var pag = document.getElementById('pagamento-select').value;
            var sub = carrinho.reduce(function(s,i) { return s + (i.preco*i.quantidade); }, 0);
            if (!nome || !tel || !pag || carrinho.length === 0) { alert('Preencha!'); return; }
            var pedidoId = Date.now();
            var pedidos = getDados('todosPedidos');
            pedidos.push({ pedido_id: pedidoId, data: new Date().toISOString(), cardapio: 'cardapio2', cliente: nome, telefone: tel, pagamento: pag, total: sub, itens: carrinho.map(function(i) { return { nome: i.nome, emoji: i.emoji, quantidade: i.quantidade, preco: i.preco }; }), status: 'novo', pagamentoStatus: 'pendente' });
            setDados('todosPedidos', pedidos);
            
            // Diminuir estoque do cardápio 2
            var c2 = getDados('cardapio2');
            carrinho.forEach(function(i) {
                var item = c2.find(function(x) { return x.id === i.id; });
                if (item) item.quantidade = Math.max(0, item.quantidade - i.quantidade);
            });
            setDados('cardapio2', c2);
            
            var c = JSON.parse(localStorage.getItem('adminConfig') || '{}');
            var msg = '🍫 *NOVO PEDIDO* 🍫\n\n👤 *' + nome + '*\n📱 *' + tel + '*\n📦 *Pedido #' + pedidoId + '*\n💳 *' + pag + '*\n\n📋 *ITENS:*\n';
            carrinho.forEach(function(i) { msg += i.emoji + ' ' + i.quantidade + 'x ' + i.nome + ' - R$ ' + (i.preco*i.quantidade).toFixed(2) + '\n'; });
            msg += '\n💵 *TOTAL: R$ ' + sub.toFixed(2) + '*';
            if (pag === 'PIX') msg += '\n\n📱 *PIX:* `' + (c.pix || 'pix@dindingourmet.com.br') + '`';
            window.open('https://wa.me/' + (c.whatsapp || '5561986471897') + '?text=' + encodeURIComponent(msg), '_blank');
            document.getElementById('pedido-id').textContent = '#' + pedidoId;
            document.getElementById('sucesso-msg').style.display = 'block';
            document.getElementById('btn-finalizar').style.display = 'none';
            carrinho = []; atualizar(); carregarCardapio();
        }

        document.getElementById('telefone-cliente').addEventListener('input', function(e) {
            var v = e.target.value.replace(/\D/g,'').slice(0,11);
            if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
            if (v.length > 10) v = v.slice(0,10) + '-' + v.slice(10);
            e.target.value = v; validar();
        });
        document.getElementById('nome-cliente').addEventListener('input', validar);
        document.getElementById('pagamento-select').addEventListener('change', function() {
            document.getElementById('pix-info').style.display = this.value === 'PIX' ? 'block' : 'none'; validar();
        });

        carregarCardapio(); atualizar();
    </script>
</body>
</html>
