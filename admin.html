<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dindins Gourmet FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #5C3317, #8B4513, #A0522D); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #FFF8DC; padding: 40px; border-radius: 20px; border: 2px solid #DAA520; text-align: center; max-width: 400px; width: 90%; }
        .logo { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #CC5500, #DAA520); color: white; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        h2 { color: #CC5500; margin-bottom: 10px; }
        p { color: #8B4513; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #DAA520; border-radius: 10px; font-size: 16px; background: #FFF8DC; }
        button { width: 100%; padding: 14px; background: #CC5500; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background: #E0551F; }
        .erro { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">DFX</div>
        <h2>Dindins Gourmet FX</h2>
        <p>Painel do Administrador</p>
        <input type="text" id="usuario" placeholder="Usuário (master)">
        <input type="password" id="senha" placeholder="Senha (admin123)">
        <button onclick="entrar()">🚀 Entrar</button>
        <p class="erro" id="erro">❌ Usuário ou senha incorretos!</p>
        <p style="margin-top:15px;font-size:14px;color:#8B4513;">Use: master / admin123</p>
    </div>

    <script>
        console.log('✅ Script carregado!');

        function entrar() {
            console.log('🔑 Tentando login...');
            var u = document.getElementById('usuario').value.trim().toLowerCase();
            var s = document.getElementById('senha').value;
            
            if (u === 'master' && s === 'admin123') {
                console.log('✅ Login OK!');
                document.querySelector('.login-box').innerHTML = '<h2 style="color:#228B22;">✅ LOGIN REALIZADO!</h2><p style="font-size:20px;">Bem-vindo, Admin Master!</p><p style="margin-top:20px;">O sistema está funcionando!</p>';
                document.getElementById('erro').style.display = 'none';
            } else {
                console.log('❌ Senha errada');
                document.getElementById('erro').style.display = 'block';
            }
        }

        // Enter para login
        document.getElementById('senha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') entrar();
        });

        console.log('✅ Pronto! Faça login com master / admin123');
    </script>
</body>
</html>
