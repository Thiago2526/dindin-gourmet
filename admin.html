<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dindins Gourmet FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #5C3317; min-height: 100vh; }
        .login-box { max-width: 400px; margin: 80px auto; background: #FFF8DC; padding: 30px; border-radius: 15px; border: 2px solid #DAA520; text-align: center; }
        .logo { width: 70px; height: 70px; border-radius: 50%; background: #CC5500; color: white; font-size: 28px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        h2 { color: #CC5500; }
        p { color: #8B4513; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #DAA520; border-radius: 8px; font-size: 16px; background: #FFF8DC; }
        button { width: 100%; padding: 14px; background: #CC5500; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .erro { color: red; margin-top: 10px; display: none; }
        .painel { display: none; max-width: 1200px; margin: 20px auto; background: #FFF8DC; padding: 20px; border-radius: 15px; border: 2px solid #DAA520; }
        .tabs { display: flex; gap: 5px; flex-wrap: wrap; margin: 15px 0; }
        .tab-btn { padding: 10px 15px; background: #D2691E; color: #FFD700; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #FFD700; color: #8B4513; }
        .conteudo { background: #FFF8DC; padding: 20px; border-radius: 10px; border: 1px solid #DAA520; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; color: #8B4513; margin-bottom: 4px; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 2px; font-size: 14px; }
        .btn-primary { background: #CC5500; color: white; }
        .btn-success { background: #228B22; color: white; }
        .btn-danger { background: #8B0000; color: white; }
        .btn-warning { background: #DAA520; color: #5C3317; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-small { padding: 5px 10px; font-size: 12px; }
        .card-item { background: #FFF8DC; padding: 15px; border-radius: 8px; border: 1px solid #DAA520; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #D2691E; color: #FFD700; padding: 10px; text-align: left; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid #DAA520; font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-entrada { background: #90EE90; color: #006400; }
        .badge-saida { background: #FFB6C1; color: #8B0000; }
        .badge-alocacao { background: #87CEEB; color: #00008B; }
        .badge-pago { background: #90EE90; color: #006400; }
        .badge-pendente { background: #FFD700; color: #8B4513; }
        .status-conexao { font-size: 12px; margin-top: 10px; }
        @media (max-width: 600px) { .tabs { flex-direction: column; } }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="telaLogin">
        <div class="login-box">
            <div class="logo">DFX</div>
            <h2>Dindins Gourmet FX</h2>
            <p>Painel do Administrador</p>
            <input type="text" id="campoUsuario" placeholder="Usuário">
            <input type="password" id="campoSenha" placeholder="Senha">
            <button onclick="fazerLogin()">🚀 Entrar</button>
            <p class="erro" id="erroLogin">❌ Usuário ou senha incorretos!</p>
            <p style="margin-top:15px;font-size:14px;">master / admin123</p>
            <p class="status-conexao" id="statusConexao">Conectando ao banco...</p>
        </div>
    </div>

    <!-- PAINEL -->
    <div class="painel" id="painelAdmin">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
            <h2>🍫 Dindins Gourmet FX</h2>
            <button class="btn btn-danger" onclick="sair()">🚪 Sair</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="mudarTab('estoque')">📦 Estoque</button>
            <button class="tab-btn" onclick="mudarTab('c2')">🔥 Cardápio 2</button>
            <button class="tab-btn" onclick="mudarTab('pedidos')">📋 Pedidos</button>
            <button class="tab-btn" onclick="mudarTab('pagamentos')">💳 Pagamentos</button>
            <button class="tab-btn" onclick="mudarTab('historico')">📜 Histórico</button>
            <button class="tab-btn" onclick="mudarTab('config')">⚙️ Config</button>
        </div>

        <div class="conteudo" id="conteudo-estoque">
            <h3>📦 Estoque Geral</h3>
            <div class="form-group"><label>Nome</label><input type="text" id="estoqueNome"></div>
            <div class="form-group"><label>Emoji</label><input type="text" id="estoqueEmoji" maxlength="2" placeholder="🍫"></div>
            <div class="form-group"><label>Preço R$</label><input type="number" id="estoquePreco" step="0.01"></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="estoqueQtd" value="10"></div>
            <button class="btn btn-primary" onclick="cadastrarItem()">💾 Cadastrar</button>
            <div id="listaEstoque" style="margin-top:15px;"></div>
        </div>

        <div class="conteudo" id="conteudo-c2" style="display:none;">
            <h3>🔥 Cardápio 2</h3>
            <div class="form-group"><label>Sabor</label><select id="alocarSabor"></select></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="alocarQtd" value="10"></div>
            <button class="btn btn-success" onclick="alocarC2()">📤 Alocar</button>
            <div id="listaC2" style="margin-top:15px;"></div>
        </div>

        <div class="conteudo" id="conteudo-pedidos" style="display:none;">
            <h3>📋 Pedidos</h3>
            <div id="listaPedidos"></div>
        </div>

        <div class="conteudo" id="conteudo-pagamentos" style="display:none;">
            <h3>💳 Pagamentos</h3>
            <div id="listaPagamentos"></div>
        </div>

        <div class="conteudo" id="conteudo-historico" style="display:none;">
            <h3>📜 Histórico</h3>
            <div id="listaHistorico"></div>
        </div>

        <div class="conteudo" id="conteudo-config" style="display:none;">
            <h3>⚙️ Configurações</h3>
            <div class="form-group"><label>WhatsApp (com DDD)</label><input type="text" id="configWhatsapp"></div>
            <div class="form-group"><label>Chave PIX</label><input type="text" id="configPix"></div>
            <div class="form-group"><label>Endereço Retirada</label><input type="text" id="configEndereco"></div>
            <button class="btn btn-success" onclick="salvarConfig()">💾 Salvar</button>
        </div>
    </div>

    <script>
        console.log('✅ Script carregado!');

        // ============ SUPABASE ============
        var SUPABASE_URL = 'https://khgkneegpxcgufslupby.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_yiQJTpp-mB2sD3QGtSBrOA_euX6346G';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase inicializado!');
        
        document.getElementById('statusConexao').textContent = '🟢 Banco conectado!';
        document.getElementById('statusConexao').style.color = 'green';

        // ============ LOGIN ============
        function fazerLogin() {
            console.log('🔑 Tentando login...');
            var u = document.getElementById('campoUsuario').value.trim();
            var s = document.getElementById('campoSenha').value;
            
            if (u === 'master' && s === 'admin123') {
                console.log('✅ Login OK!');
                document.getElementById('telaLogin').style.display = 'none';
                document.getElementById('painelAdmin').style.display = 'block';
                document.getElementById('erroLogin').style.display = 'none';
                carregarTudo();
            } else {
                document.getElementById('erroLogin').style.display = 'block';
            }
        }

        function sair() {
            document.getElementById('telaLogin').style.display = 'block';
            document.getElementById('painelAdmin').style.display = 'none';
        }

        document.getElementById('campoSenha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });

        // ============ TABS ============
        function mudarTab(tab) {
            var conteudos = ['estoque', 'c2', 'pedidos', 'pagamentos', 'historico', 'config'];
            conteudos.forEach(function(c) { document.getElementById('conteudo-' + c).style.display = 'none'; });
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById('conteudo-' + tab).style.display = 'block';
            event.target.classList.add('active');
            if (tab === 'estoque') carregarEstoque();
            if (tab === 'c2') carregarC2();
            if (tab === 'pedidos') carregarPedidos();
            if (tab === 'pagamentos') carregarPagamentos();
            if (tab === 'historico') carregarHistorico();
            if (tab === 'config') carregarConfig();
        }

        // ============ ESTOQUE (SUPABASE) ============
        async function cadastrarItem() {
            var nome = document.getElementById('estoqueNome').value.trim();
            var emoji = document.getElementById('estoqueEmoji').value.trim();
            var preco = parseFloat(document.getElementById('estoquePreco').value);
            var qtd = parseInt(document.getElementById('estoqueQtd').value) || 0;
            if (!nome || !preco) { alert('Preencha!'); return; }

            try {
                var { data: existente } = await supabase.from('estoqueCentral').select('*').eq('nome', nome).single();
                if (existente) {
                    await supabase.from('estoqueCentral').update({ quantidadeTotal: existente.quantidadeTotal + qtd, preco: preco, emoji: emoji || '🍫' }).eq('id', existente.id);
                } else {
                    await supabase.from('estoqueCentral').insert([{ nome: nome, emoji: emoji || '🍫', preco: preco, quantidadeTotal: qtd || 50, alocadoCardapio2: 0 }]);
                }
                carregarEstoque();
                alert('✅ Salvo no banco!');
            } catch(e) {
                console.error('Erro:', e);
                alert('❌ Erro ao salvar. Verifique o console.');
            }
        }

        async function carregarEstoque() {
            try {
                var { data: estoque } = await supabase.from('estoqueCentral').select('*');
                estoque = estoque || [];
                var lista = document.getElementById('listaEstoque');
                var select = document.getElementById('alocarSabor');
                if (select) {
                    select.innerHTML = '<option value="">Selecione...</option>';
                    estoque.forEach(function(i) { var d = i.quantidadeTotal - i.alocadoCardapio2; select.innerHTML += '<option value="' + i.id + '">' + i.nome + ' - Disp: ' + d + '</option>'; });
                }
                if (estoque.length === 0) { lista.innerHTML = '<p>Nenhum item.</p>'; return; }
                lista.innerHTML = estoque.map(function(i) {
                    var d = i.quantidadeTotal - i.alocadoCardapio2;
                    return '<div class="card-item"><strong>' + i.emoji + ' ' + i.nome + '</strong> - R$ ' + i.preco.toFixed(2) + '<br><small>Total: ' + i.quantidadeTotal + ' | C2: ' + i.alocadoCardapio2 + ' | Disp: ' + d + '</small></div>';
                }).join('');
            } catch(e) {
                console.error('Erro ao carregar:', e);
            }
        }

        // ============ CARDÁPIO 2 ============
        async function alocarC2() {
            var id = document.getElementById('alocarSabor').value;
            var q = parseInt(document.getElementById('alocarQtd').value);
            if (!id || !q || q < 1) { alert('Selecione!'); return; }

            try {
                var { data: item } = await supabase.from('estoqueCentral').select('*').eq('id', id).single();
                if (!item) return;
                var d = item.quantidadeTotal - item.alocadoCardapio2;
                if (q > d) { alert('Máx: ' + d); return; }

                await supabase.from('estoqueCentral').update({ alocadoCardapio2: item.alocadoCardapio2 + q }).eq('id', id);

                var { data: existente } = await supabase.from('cardapio2').select('*').eq('nome', item.nome).single();
                if (existente) {
                    await supabase.from('cardapio2').update({ quantidade: existente.quantidade + q }).eq('id', existente.id);
                } else {
                    await supabase.from('cardapio2').insert([{ nome: item.nome, emoji: item.emoji, preco: item.preco, quantidade: q }]);
                }

                carregarEstoque(); carregarC2();
                alert('✅ Alocado!');
            } catch(e) {
                console.error('Erro:', e);
                alert('❌ Erro ao alocar.');
            }
        }

        async function carregarC2() {
            try {
                var { data: c2 } = await supabase.from('cardapio2').select('*');
                c2 = c2 || [];
                var lista = document.getElementById('listaC2');
                if (c2.length === 0) { lista.innerHTML = '<p>Nenhum item.</p>'; return; }
                lista.innerHTML = c2.map(function(i) { return '<div class="card-item"><strong>' + i.emoji + ' ' + i.nome + '</strong> - R$ ' + i.preco.toFixed(2) + ' | Qtd: ' + i.quantidade + '</div>'; }).join('');
            } catch(e) { console.error(e); }
        }

        // ============ PEDIDOS ============
        async function carregarPedidos() {
            try {
                var { data: p } = await supabase.from('todosPedidos').select('*').order('data', { ascending: false });
                p = p || [];
                var lista = document.getElementById('listaPedidos');
                if (p.length === 0) { lista.innerHTML = '<p>Nenhum pedido.</p>'; return; }
                lista.innerHTML = p.map(function(x) { return '<div class="card-item"><strong>👤 ' + x.cliente + '</strong> - R$ ' + x.total.toFixed(2) + '<br><small>' + x.pagamento + '</small></div>'; }).join('');
            } catch(e) { console.error(e); }
        }

        // ============ PAGAMENTOS ============
        async function carregarPagamentos() {
            try {
                var { data: p } = await supabase.from('todosPedidos').select('*').order('data', { ascending: false });
                p = p || [];
                var lista = document.getElementById('listaPagamentos');
                if (p.length === 0) { lista.innerHTML = '<p>Nenhum.</p>'; return; }
                lista.innerHTML = p.map(function(x) {
                    var st = x.pagamentoStatus === 'pago' ? '<span class="badge badge-pago">✅ PAGO</span>' : '<span class="badge badge-pendente">⏳ PENDENTE</span>';
                    var btn = x.pagamentoStatus !== 'pago' ? '<button class="btn btn-success btn-small" onclick="confirmarPag(' + x.pedido_id + ')">✅ Confirmar</button>' : '';
                    var btnLembrar = x.pagamentoStatus !== 'pago' && x.telefone ? '<button class="btn btn-whatsapp btn-small" onclick="lembrar(\'' + x.telefone + '\',\'' + x.cliente + '\',' + x.total + ')">📱 Lembrar</button>' : '';
                    return '<div class="card-item"><strong>👤 ' + x.cliente + '</strong> ' + st + '<br><small>R$ ' + x.total.toFixed(2) + '</small><br>' + btn + ' ' + btnLembrar + '</div>';
                }).join('');
            } catch(e) { console.error(e); }
        }

        async function confirmarPag(pedidoId) {
            await supabase.from('todosPedidos').update({ pagamentoStatus: 'pago' }).eq('pedido_id', pedidoId);
            carregarPagamentos();
            alert('✅ Confirmado!');
        }

        function lembrar(telefone, nome, total) {
            var msg = '🍫 *LEMBRETE*\n\nOlá ' + nome + '!\nSeu pedido está aguardando pagamento.\nValor: R$ ' + total.toFixed(2);
            window.open('https://wa.me/55' + telefone + '?text=' + encodeURIComponent(msg), '_blank');
        }

        // ============ HISTÓRICO ============
        async function carregarHistorico() {
            try {
                var { data: h } = await supabase.from('historicoEstoque').select('*').order('data', { ascending: false });
                h = h || [];
                var lista = document.getElementById('listaHistorico');
                if (h.length === 0) { lista.innerHTML = '<p>Nenhum registro.</p>'; return; }
                lista.innerHTML = h.map(function(x) { return '<div class="card-item">' + x.data + ' - ' + x.tipo + ' - ' + x.item + ' (' + x.quantidade + ')</div>'; }).join('');
            } catch(e) { console.error(e); }
        }

        // ============ CONFIG ============
        async function carregarConfig() {
            var { data: c } = await supabase.from('config').select('*').eq('chave', 'admin').single();
            var dados = c ? (c.dados || {}) : {};
            document.getElementById('configWhatsapp').value = dados.whatsapp || '';
            document.getElementById('configPix').value = dados.pix || '';
            document.getElementById('configEndereco').value = dados.endereco || '';
        }

        async function salvarConfig() {
            var dados = { whatsapp: document.getElementById('configWhatsapp').value, pix: document.getElementById('configPix').value, endereco: document.getElementById('configEndereco').value };
            await supabase.from('config').upsert({ chave: 'admin', dados: dados });
            alert('✅ Salvo!');
        }

        function carregarTudo() { carregarEstoque(); carregarC2(); }
    </script>
</body>
</html>
