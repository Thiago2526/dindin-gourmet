<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Dindins Gourmet FX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --laranja: #CC5500;
            --dourado: #DAA520;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0604;
            --bg-card: #24140c;
            --bg-input: #1a0f0a;
            --text-primary: #f0e0d0;
            --text-secondary: #c4b0a0;
            --text-muted: #8a7a6a;
            --border-color: #4a3020;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-primary: #f5efe8;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #2a1a10;
            --text-secondary: #5a4030;
            --text-muted: #8a7a6a;
            --border-color: #d4c4b0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(ellipse at center, var(--bg-primary), #000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .reset-box {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .logo {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--laranja), var(--dourado));
            color: white;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(204,85,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        h2 { color: var(--dourado); margin-bottom: 8px; font-size: 1.5em; }
        p { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95em; }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-size: 0.85em;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 15px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--laranja);
            box-shadow: 0 0 0 4px rgba(204,85,0,0.15);
            outline: none;
        }

        .senha-forca {
            height: 4px;
            background: var(--bg-primary);
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }
        .senha-forca .barra {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        .senha-texto {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--laranja), #E0551F);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            min-height: 50px;
        }
        .btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 4px 20px rgba(204,85,0,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            margin-top: 10px;
        }
        .btn-secondary:hover:not(:disabled) { background: var(--border-color); }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 600;
            z-index: 99999;
            display: none;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: #3b82f6; }

        .mensagem {
            margin-top: 12px;
            font-size: 0.9em;
            color: var(--text-secondary);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="reset-box">
        <div class="logo">🔑</div>
        <h2>Redefinir Senha</h2>
        <p>Digite sua nova senha abaixo.</p>

        <div id="statusMessage" class="mensagem"></div>

        <div class="form-group">
            <label for="novaSenha">Nova Senha <span style="color:var(--danger);">*</span></label>
            <input type="password" id="novaSenha" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
            <div class="senha-forca"><div class="barra" id="strengthBar"></div></div>
            <div class="senha-texto" id="strengthText">Digite uma senha forte</div>
        </div>

        <div class="form-group">
            <label for="confirmaSenha">Confirmar Nova Senha <span style="color:var(--danger);">*</span></label>
            <input type="password" id="confirmaSenha" placeholder="Confirme a nova senha" autocomplete="new-password">
        </div>

        <button class="btn" id="btnReset" onclick="redefinirSenha()">✅ Redefinir Senha</button>
        <button class="btn btn-secondary" onclick="window.location.href='admin.html'">← Voltar ao Login</button>
    </div>

    <script>
    (function() {
        'use strict';

        // Usa "sb" para evitar conflito com window.supabase
        const sb = window.supabase.createClient(
            'https://khgkneegpxcgufslupby.supabase.co',
            'sb_publishable_yiQJTpp-mB2sD3QGtSBrOA_euX6346G',
            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
        );

        function mostrarToast(msg, tipo = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + tipo;
            t.style.display = 'block';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => { t.style.display = 'none'; }, 4000);
        }

        function verificarForcaSenha(senha) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            if (!senha || senha.length === 0) {
                bar.className = 'barra';
                bar.style.width = '0%';
                text.textContent = 'Digite uma senha forte';
                return;
            }

            let score = 0;
            if (senha.length >= 8) score++;
            if (senha.length >= 12) score++;
            if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) score++;
            if (/\d/.test(senha)) score++;
            if (/[^a-zA-Z0-9]/.test(senha)) score++;

            const levels = [
                { min: 0, class: '', text: 'Digite uma senha forte', color: '' },
                { min: 1, class: 'weak', text: 'Senha fraca', color: '#ef4444' },
                { min: 2, class: 'weak', text: 'Senha fraca', color: '#ef4444' },
                { min: 3, class: 'medium', text: 'Senha média', color: '#f59e0b' },
                { min: 4, class: 'strong', text: 'Senha forte', color: '#3b82f6' },
                { min: 5, class: 'very-strong', text: 'Senha muito forte!', color: '#22c55e' }
            ];

            const level = levels.reduce((prev, curr) => score >= curr.min ? curr : prev, levels[0]);
            bar.style.width = (score / 5 * 100) + '%';
            bar.style.background = level.color;
            text.textContent = level.text;
        }

        document.getElementById('novaSenha').addEventListener('input', function() {
            verificarForcaSenha(this.value);
        });

        async function redefinirSenha() {
            const nova = document.getElementById('novaSenha').value;
            const confirma = document.getElementById('confirmaSenha').value;
            const btn = document.getElementById('btnReset');
            const statusMsg = document.getElementById('statusMessage');

            statusMsg.textContent = '';
            statusMsg.style.color = '';

            if (!nova || nova.length < 8) {
                mostrarToast('A senha deve ter no mínimo 8 caracteres.', 'warning');
                document.getElementById('novaSenha').focus();
                return;
            }

            if (nova !== confirma) {
                mostrarToast('As senhas não coincidem.', 'error');
                document.getElementById('confirmaSenha').focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Processando...';
            statusMsg.textContent = '⏳ Atualizando senha...';
            statusMsg.style.color = '#3b82f6';

            try {
                const { data, error } = await sb.auth.updateUser({ password: nova });

                if (error) throw error;

                statusMsg.textContent = '✅ Senha redefinida com sucesso!';
                statusMsg.style.color = '#22c55e';
                mostrarToast('✅ Senha redefinida com sucesso!', 'success');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);

            } catch (error) {
                console.error('Erro ao redefinir senha:', error);
                statusMsg.textContent = '❌ ' + (error.message || 'Erro ao redefinir senha');
                statusMsg.style.color = '#ef4444';
                mostrarToast('❌ ' + (error.message || 'Erro ao redefinir senha'), 'error');
                btn.disabled = false;
                btn.textContent = '✅ Redefinir Senha';
            }
        }

        async function verificarSessao() {
            try {
                const { data: { session }, error } = await sb.auth.getSession();
                if (error) throw error;

                if (!session) {
                    document.querySelector('.reset-box').innerHTML = `
                        <div class="logo">🔒</div>
                        <h2>Sessão Inválida</h2>
                        <p>O link de redefinição expirou ou é inválido.</p>
                        <p style="font-size:0.85em;color:var(--text-muted);">Solicite um novo link na tela de login.</p>
                        <button class="btn btn-secondary" onclick="window.location.href='admin.html'">
                            ← Voltar ao Login
                        </button>
                    `;
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        document.getElementById('confirmaSenha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') redefinirSenha();
        });

        document.getElementById('novaSenha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('confirmaSenha').focus();
        });

        verificarSessao();

        // Expõe globalmente
        window.redefinirSenha = redefinirSenha;
    })();
    </script>
</body>
</html>
