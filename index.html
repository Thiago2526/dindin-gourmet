<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindins Gourmet FX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5C3317 0%, #8B4513 50%, #A0522D 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; text-align: center; }
        .logo {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #CC5500, #DAA520);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: white; font-weight: bold;
            margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
        h1 { color: #FFD700; font-size: 2.2em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitulo { color: #F4A460; font-size: 1.1em; margin-bottom: 40px; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card {
            background: #FFF8DC; padding: 25px 15px; border-radius: 16px;
            border: 2px solid #DAA520; text-decoration: none; transition: all 0.3s;
            cursor: pointer; position: relative;
        }
        .card:active { transform: scale(0.95); }
        .card .emoji { font-size: 2.5em; margin-bottom: 10px; }
        .card h2 { color: #CC5500; font-size: 1.1em; margin-bottom: 8px; }
        .card p { color: #8B4513; font-size: 0.85em; }
        .badge {
            position: absolute; top: 8px; right: 8px;
            background: #CC5500; color: #FFD700; padding: 4px 10px;
            border-radius: 12px; font-size: 0.75em; font-weight: bold;
        }
        .admin-link { display: inline-block; margin-top: 25px; color: #FFD700; text-decoration: none; font-size: 0.9em; opacity: 0.7; }
        .admin-link:hover { opacity: 1; }
        @media (max-width: 500px) {
            .cards { grid-template-columns: 1fr; }
            h1 { font-size: 1.8em; }
            .logo { width: 80px; height: 80px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DFX</div>
        <h1>Dindins Gourmet FX</h1>
        <p class="subtitulo">Escolha seu cardápio e faça já seu pedido!</p>

        <div class="cards">
            <a href="cardapio1.html" class="card">
                <div class="emoji">📋</div>
                <h2>Dindins Gourmet Cardápio</h2>
                <p>Cardápio principal com todos os sabores e opções de entrega por setor</p>
            </a>

            <a href="cardapio2.html" class="card">
                <span class="badge">🔥 DOIS MARCOS</span>
                <div class="emoji">🔥</div>
                <h2>Cardápio Dois Marcos</h2>
                <p>Cardápio exclusivo com entrega especial</p>
            </a>
        </div>

        <a href="admin.html" class="admin-link">🔐 Área do Administrador</a>
    </div>
</body>
</html>
