<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindins Gourmet FX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #5C3317, #8B4513, #A0522D); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; text-align: center; }
        .logo { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #CC5500, #DAA520); display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; font-weight: bold; margin: 0 auto 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        h1 { color: #FFD700; font-size: 2.2em; margin-bottom: 10px; }
        .subtitulo { color: #F4A460; margin-bottom: 40px; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #FFF8DC; padding: 25px 15px; border-radius: 16px; border: 2px solid #DAA520; text-decoration: none; color: #8B4513; position: relative; }
        .card h2 { color: #CC5500; font-size: 1.1em; margin: 8px 0; }
        .admin-link { display: inline-block; margin-top: 25px; color: #FFD700; text-decoration: none; opacity: 0.7; }
        @media (max-width: 500px) { .cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DFX</div>
        <h1>Dindins Gourmet FX</h1>
        <p class="subtitulo">Escolha seu cardápio e faça já seu pedido!</p>
        <div class="cards">
            <a href="cardapio1.html" class="card">
                <div style="font-size:2.5em;">📋</div>
                <h2>Dindins Gourmet Cardápio</h2>
                <p style="font-size:0.9em;">Todos os sabores, retirada ou entrega por setor</p>
            </a>
            <a href="cardapio2.html" class="card">
                <div style="font-size:2.5em;">🍫</div>
                <h2>Cardápio</h2>
                <p style="font-size:0.9em;">Faça seu pedido</p>
            </a>
        </div>
        <a href="admin.html" class="admin-link">🔐 Área do Administrador</a>
    </div>
</body>
</html>
