<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindins Gourmet FX</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #5C3317, #8B4513, #A0522D);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #FFF8DC;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #DAA520;
        }
        .logo { font-size: 5em; margin-bottom: 10px; }
        h1 { color: #CC5500; font-size: 1.8em; margin-bottom: 6px; font-weight: 800; }
        .sub { color: #8B4513; font-size: 1em; margin-bottom: 30px; }
        .menu-item {
            display: block;
            background: linear-gradient(135deg, #CC5500, #E0551F);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 14px;
            font-size: 1.2em;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(204,85,0,0.3);
        }
        .menu-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(204,85,0,0.5);
        }
        .menu-item .emoji { font-size: 1.5em; margin-right: 10px; }
        .menu-item .desc { display: block; font-size: 0.75em; font-weight: 400; margin-top: 4px; opacity: 0.9; }
        .footer { margin-top: 24px; color: #8B4513; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍦</div>
        <h1>Dindins Gourmet FX</h1>
        <p class="sub">Escolha o seu cardápio</p>

        <a href="cardapio1.html" class="menu-item">
            <span class="emoji">🍦</span> Cardápio 1
            <span class="desc">Açaís, sorvetes e sobremesas</span>
        </a>

        <a href="cardapio2.html" class="menu-item">
            <span class="emoji">🔥</span> Cardápio 2 - Especial
            <span class="desc">Seleção especial da casa</span>
        </a>

        <div class="footer">
            📱 Dindins Gourmet FX © 2026
        </div>
    </div>
</body>
</html>
