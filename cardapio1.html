<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio Principal - Dindins Gourmet FX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #5C3317, #8B4513, #A0522D); min-height: 100vh; padding: 15px; font-size: 18px; }
.container { max-width: 850px; margin: 0 auto; background: #FFF8DC; border-radius: 16px; overflow: hidden; border: 2px solid #DAA520; }
.header { background: linear-gradient(135deg, #8B4513, #A0522D); color: #FFD700; padding: 25px; text-align: center; }
.header h1 { font-size: 2em; }
.header p { font-size: 1.2em; color: #F4A460; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
.menu-item { background: #FFF8DC; border: 2px solid #DAA520; border-radius: 14px; padding: 18px; text-align: center; }
.menu-item .foto-item { width: 100%; height: 150px; border-radius: 10px; object-fit: cover; margin-bottom: 10px; display: block; }
.menu-item .emoji-item { font-size: 5em; margin-bottom: 10px; display: block; }
.menu-item h3 { color: #CC5500; font-size: 1.3em; margin-bottom: 5px; }
.preco { font-size: 1.6em; color: #CC5500; font-weight: bold; margin-bottom: 8px; }
.disponivel { font-size: 1em; color: #DAA520; margin-bottom: 10px; }
.qtd-controle { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
.btn-qtd { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #CC5500; background: #FFF8DC; color: #CC5500; font-size: 1.4em; cursor: pointer; font-weight: bold; }
.btn-qtd:active { background: #CC5500; color: #FFD700; }
.quantidade { font-size: 1.3em; font-weight: bold; color: #8B4513; min-width: 30px; text-align: center; }
.carrinho-section { background: #D2691E; padding: 25px; border-top: 3px solid #DAA520; }
.carrinho-title { color: #FFD700; text-align: center; font-size: 1.5em; margin-bottom: 15px; }
.form-section { background: #FFF8DC; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: bold; color: #8B4513; margin-bottom: 5px; font-size: 1.1em; }
.form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #DAA520; border-radius: 10px; font-size: 18px; background: #FFF8DC; }
.total-section { background: #FFF8DC; padding: 18px; border-radius: 12px; margin-bottom: 15px; }
.total-final { font-size: 1.6em; font-weight: bold; color: #CC5500; display: flex; justify-content: space-between; }
.btn-finalizar { width: 100%; padding: 16px; background: #25D366; color: white; border: none; border-radius: 12px; font-size: 1.3em; font-weight: bold; cursor: pointer; }
.btn-finalizar:disabled { opacity: 0.5; background: #ccc; }
.btn-localizacao { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 8px; }
.pix-info { display: none; background: #FFF8DC; padding: 18px; border-radius: 12px; border: 2px solid #DAA520; margin-bottom: 15px; }
.pix-chave { background: white; padding: 14px; border-radius: 10px; font-size: 1.2em; text-align: center; word-break: break-all; }
.btn-copiar-pix { width: 100%; padding: 12px; background: #CC5500; color: #FFD700; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 8px; }
.sucesso-msg { display: none; background: #d4edda; color: #155724; padding: 20px; border-radius: 12px; text-align: center; margin-top: 15px; font-size: 1.2em; }
.item-carrinho { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #FFF8DC; border-radius: 8px; margin-bottom: 8px; font-size: 1.1em; gap: 8px; }
.btn-remover { background: #8B0000; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
@media (max-width: 480px) { .menu-grid { grid-template-columns: 1fr; } .header h1 { font-size: 1.6em; } }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>🍦 Cardápio Principal</h1><p>Dindins Gourmet FX</p></div>
  <div class="menu-grid" id="menu-grid"></div>
  <div class="carrinho-section">
    <h3 class="carrinho-title">🛒 Seu Pedido</h3>
    <div id="carrinho-itens"></div>
    <div class="total-section" id="total-section" style="display:none;">
      <div class="total-final"><span>TOTAL:</span><span id="total-geral">R$ 0,00</span></div>
    </div>
    <div class="form-section" id="form-section" style="display:none;">
      <div class="form-group">
        <label>📍 Retirada ou Entrega? *</label>
        <select id="tipo-entrega">
          <option value="">Selecione...</option>
          <option value="retirada">🏪 Retirar no local</option>
          <option value="entrega">🛵 Solicitar entrega</option>
        </select>
      </div>
      <div id="area-retirada" style="display:none;">
        <div style="background:#FFF3CD;padding:12px;border-radius:10px;margin-bottom:10px;">
          <strong style="font-size:1.1em;">📍 Endereço:</strong>
          <p id="endereco-texto" style="font-size:1.1em;margin:5px 0;"></p>
          <button class="btn-localizacao" onclick="enviarLocalizacao()">📍 Enviar localização</button>
        </div>
      </div>
      <div id="area-entrega" style="display:none;">
        <div class="form-group"><label>🏙️ Setor/Bairro *</label><select id="setor-select"><option value="">Selecione...</option></select></div>
        <div class="form-group"><label>🏠 Quadra</label><input type="text" id="quadra-input" placeholder="Ex: Quadra 10, Casa 5"></div>
      </div>
      <div class="form-group"><label>👤 Nome Completo *</label><input type="text" id="nome-cliente"></div>
      <div class="form-group"><label>📱 WhatsApp *</label><input type="tel" id="telefone-cliente" placeholder="(00) 00000-0000"></div>
      <div class="form-group"><label>💳 Pagamento *</label><select id="pagamento-select"><option value="">Selecione</option><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div>
      <div class="pix-info" id="pix-info"><h4 style="font-size:1.2em;">📱 Chave PIX</h4><div class="pix-chave" id="pix-chave-display"></div><button class="btn-copiar-pix" onclick="copiarPix()">📋 Copiar PIX</button></div>
    </div>
    <button class="btn-finalizar" id="btn-finalizar" onclick="finalizarPedido()" disabled>📱 Finalizar Pedido</button>
    <div class="sucesso-msg" id="sucesso-msg"><h3>✅ Pedido Realizado!</h3><p>📦 Nº <strong id="pedido-id"></strong></p></div>
  </div>
</div>
<script>
// Renomeado de "supabase" para "db": evita sobrescrever o objeto global da biblioteca
var db = window.supabase.createClient('https://khgkneegpxcgufslupby.supabase.co', 'sb_publishable_yiQJTpp-mB2sD3QGtSBrOA_euX6346G');

var carrinho = [], cardapioDados = [], config = {}, setores = [], enviando = false;
var WHATS_PADRAO = '5561986471897', PIX_PADRAO = 'pix@dindingourmet.com.br';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fmt(v) { return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function whatsNumero() { var n = String(config.whatsapp || WHATS_PADRAO).replace(/\D/g, ''); return n.length <= 11 ? '55' + n : n; }
function pixChave() { return config.pix || PIX_PADRAO; }

async function carregarCardapio() {
  var m = $('menu-grid');
  var r = await db.from('estoqueCentral').select('*');
  if (r.error) { m.innerHTML = '<p style="color:#8B4513;font-size:1.2em;">Erro ao carregar o cardápio. Atualize a página.</p>'; return; }
  cardapioDados = (r.data || []).map(function(i) {
    return { id: i.id, nome: i.nome, emoji: i.emoji || '🍦', foto: i.foto, preco: i.preco, quantidade: Math.max(0, (i.quantidadeTotal || 0) - (i.alocadoCardapio2 || 0)) };
  }).filter(function(i) { return i.quantidade > 0; });

  if (cardapioDados.length === 0) { m.innerHTML = '<p style="color:#8B4513;font-size:1.2em;">Cardápio indisponível.</p>'; }
  else m.innerHTML = cardapioDados.map(function(i) {
    var foto = i.foto ? '<img src="' + esc(i.foto) + '" class="foto-item" alt="' + esc(i.nome) + '">' : '<span class="emoji-item">' + esc(i.emoji) + '</span>';
    var id = esc(i.id);
    return '<div class="menu-item">' + foto + '<h3>' + esc(i.nome) + '</h3><div class="preco">' + fmt(i.preco) + '</div><p class="disponivel">📦 <strong>' + i.quantidade + '</strong> unid.</p><div class="qtd-controle"><button class="btn-qtd" data-id="' + id + '" onclick="add(this.dataset.id,-1)">−</button><span class="quantidade" id="q-' + id + '">0</span><button class="btn-qtd" data-id="' + id + '" onclick="add(this.dataset.id,1)">+</button></div></div>';
  }).join('');

  // Config vem do Supabase (antes lia localStorage, que no celular do cliente está sempre vazio)
  var c = await db.from('config').select('*').eq('chave', 'admin').maybeSingle();
  config = (c.data && c.data.dados) || {};
  setores = Array.isArray(config.setores) ? config.setores : [];
  var sel = $('setor-select'), atual = sel.value;
  sel.innerHTML = '<option value="">Selecione...</option>' + setores.map(function(s, idx) {
    return '<option value="' + idx + '">' + esc(s.nome) + ' - ' + fmt(s.taxa) + '</option>';
  }).join('');
  sel.value = atual;
  $('endereco-texto').textContent = config.endereco || 'Não cadastrado';
  $('pix-chave-display').textContent = pixChave();
  atualizar();
}

function tipoEntregaChange() {
  var te = $('tipo-entrega').value;
  $('area-retirada').style.display = te === 'retirada' ? 'block' : 'none';
  $('area-entrega').style.display = te === 'entrega' ? 'block' : 'none';
  atualizarTotal(); validar();
}

function add(id, q) {
  var i = cardapioDados.find(function(x) { return String(x.id) === String(id); }); if (!i) return;
  var cc = carrinho.find(function(x) { return String(x.id) === String(id); });
  var n = (cc ? cc.quantidade : 0) + q;
  if (n <= 0) carrinho = carrinho.filter(function(x) { return String(x.id) !== String(id); });
  else if (n > i.quantidade) { alert('Máx: ' + i.quantidade); return; }
  else if (cc) cc.quantidade = n;
  else carrinho.push({ id: i.id, nome: i.nome, emoji: i.emoji, preco: i.preco, quantidade: n });
  atualizar();
}

function atualizar() {
  cardapioDados.forEach(function(i) {
    var el = $('q-' + i.id);
    if (el) { var cc = carrinho.find(function(x) { return String(x.id) === String(i.id); }); el.textContent = cc ? cc.quantidade : 0; }
  });
  var div = $('carrinho-itens');
  if (carrinho.length === 0) div.innerHTML = '<p style="color:#FFD700;font-size:1.1em;">Carrinho vazio</p>';
  else div.innerHTML = carrinho.map(function(i) {
    return '<div class="item-carrinho"><span>' + esc(i.emoji || '🍦') + ' ' + i.quantidade + 'x ' + esc(i.nome) + '</span><span style="color:#CC5500;font-weight:bold;">' + fmt(i.preco * i.quantidade) + '</span><button class="btn-remover" data-id="' + esc(i.id) + '" data-q="' + i.quantidade + '" onclick="add(this.dataset.id,-Number(this.dataset.q))">✕</button></div>';
  }).join('');
  var tem = carrinho.length > 0;
  $('form-section').style.display = tem ? 'block' : 'none';
  $('total-section').style.display = tem ? 'block' : 'none';
  if (tem && !enviando) { $('sucesso-msg').style.display = 'none'; $('btn-finalizar').style.display = 'block'; }
  atualizarTotal(); validar();
}

function taxaAtual() {
  if ($('tipo-entrega').value !== 'entrega') return 0;
  var s = setores[$('setor-select').value];
  return s ? (parseFloat(s.taxa) || 0) : 0;
}

function atualizarTotal() {
  var sub = carrinho.reduce(function(s, i) { return s + i.preco * i.quantidade; }, 0);
  $('total-geral').textContent = fmt(sub + taxaAtual());
}

function validar() {
  var te = $('tipo-entrega').value;
  var tel = $('telefone-cliente').value.replace(/\D/g, '');
  var ok = carrinho.length > 0 && $('nome-cliente').value.trim() && tel.length >= 10 && $('pagamento-select').value && te
    && (te !== 'entrega' || $('setor-select').value !== '');
  $('btn-finalizar').disabled = !ok || enviando;
}

function enviarLocalizacao() {
  var nome = $('nome-cliente').value || 'Cliente';
  var msg = '📍 *Pedido*\n\n👤 ' + nome + '\n🚶 Retirada no local\n\nEnvie sua localização!';
  window.open('https://wa.me/' + whatsNumero() + '?text=' + encodeURIComponent(msg), '_blank');
}

function copiarPix() {
  navigator.clipboard.writeText(pixChave()).then(function() { alert('✅ Copiado!'); });
}

async function finalizarPedido() {
  if (enviando) return;
  var nome = $('nome-cliente').value.trim();
  var tel = $('telefone-cliente').value.replace(/\D/g, '');
  var pag = $('pagamento-select').value;
  var te = $('tipo-entrega').value;
  if (!nome || tel.length < 10 || !pag || !te || carrinho.length === 0) { alert('Preencha todos os campos!'); return; }

  var taxa = 0, setorNome = 'Retirada';
  if (te === 'entrega') {
    var s = setores[$('setor-select').value];
    if (!s) { alert('Selecione o setor/bairro.'); return; }
    taxa = parseFloat(s.taxa) || 0;
    setorNome = s.nome;
    var quadra = $('quadra-input').value.trim();
    if (quadra) setorNome += ' - ' + quadra; // quadra agora vai junto no pedido
  }
  var sub = carrinho.reduce(function(a, i) { return a + i.preco * i.quantidade; }, 0);
  var total = sub + taxa, pedidoId = Date.now();

  enviando = true; validar();
  var btn = $('btn-finalizar'); btn.textContent = '⏳ Enviando...';
  // Abre a aba ANTES do await: depois de uma chamada assíncrona o celular bloqueia o pop-up
  var aba = window.open('', '_blank');

  var r = await db.from('todosPedidos').insert([{
    pedido_id: pedidoId, data: new Date().toISOString(), cardapio: 'cardapio1', cliente: nome, telefone: tel,
    setor: setorNome, taxaEntrega: taxa, pagamento: pag, total: total,
    itens: carrinho.map(function(i) { return { nome: i.nome, emoji: i.emoji, quantidade: i.quantidade, preco: i.preco }; }),
    status: 'novo', pagamentoStatus: 'pendente'
  }]);

  if (r.error) { // antes mostrava "Pedido Realizado" mesmo se o banco recusasse
    if (aba) aba.close();
    enviando = false; btn.textContent = '📱 Finalizar Pedido'; validar();
    alert('Não foi possível registrar o pedido. Verifique sua conexão e tente de novo.');
    return;
  }

  var msg = '🍦 *NOVO PEDIDO* 🍦\n\n👤 *' + nome + '*\n📱 *' + tel + '*\n📍 *' + setorNome + '*\n💳 *' + pag + '*\n\n📋 *ITENS:*\n';
  carrinho.forEach(function(i) { msg += (i.emoji || '🍦') + ' ' + i.quantidade + 'x ' + i.nome + ' - ' + fmt(i.preco * i.quantidade) + '\n'; });
  if (taxa > 0) msg += '\n🛵 Entrega: ' + fmt(taxa);
  msg += '\n💵 *TOTAL: ' + fmt(total) + '*';
  if (pag === 'PIX') msg += '\n\n📱 *PIX:* `' + pixChave() + '`';
  var url = 'https://wa.me/' + whatsNumero() + '?text=' + encodeURIComponent(msg);
  if (aba) aba.location.href = url; else window.location.href = url;

  $('pedido-id').textContent = '#' + pedidoId;
  $('sucesso-msg').style.display = 'block';
  btn.style.display = 'none'; btn.textContent = '📱 Finalizar Pedido';
  carrinho = []; enviando = false;
  atualizar(); $('sucesso-msg').style.display = 'block';
  carregarCardapio();
}

$('telefone-cliente').addEventListener('input', function(e) {
  var v = e.target.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 2) v = '(' + v.slice(0, 2) + ') ' + v.slice(2);
  if (v.length > 10) v = v.slice(0, 10) + '-' + v.slice(10);
  e.target.value = v; validar();
});
$('nome-cliente').addEventListener('input', validar);
$('setor-select').addEventListener('change', function() { atualizarTotal(); validar(); });
$('pagamento-select').addEventListener('change', function() { $('pix-info').style.display = this.value === 'PIX' ? 'block' : 'none'; validar(); });
$('tipo-entrega').addEventListener('change', tipoEntregaChange);

atualizar(); carregarCardapio();
</script>
</body>
</html>
